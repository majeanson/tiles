<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Portrait phone is the design target. `viewport-fit=cover` plus the
      env(safe-area-inset-*) padding in style.css keeps the board clear of the
      notch and the home indicator.

      `user-scalable=no` was DROPPED on 2026-08-20: it is a WCAG 1.4.4 failure
      and an automatic Lighthouse a11y failure, and it took pinch-to-zoom away
      from anyone who needs it to read the board. What it was here for is
      already done properly elsewhere — `touch-action: manipulation` on body
      kills the double-tap-zoom and the 300ms tap delay, and `#board` sets
      `touch-action: none`, which hands every board gesture to the game
      outright. Nothing was relying on the flag itself.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Torchlit's own background: the browser chrome should be the same dark
         the board falls off into, or the page has a seam at the top. This is the
         PRE-JS value and stays torchlit's, because torchlit is what a device
         with no stored choice and no light preference opens in; applyTheme
         rewrites it from the resolved theme a moment later. -->
    <meta name="theme-color" content="#0a0806" />
    <!-- "light dark", not "dark" (2026-08-25): the game has a light direction
         now, and this meta is what tells the browser which form controls,
         scrollbars and default canvas to hand the page. Declaring dark while
         serving daylight gives a pale board dark scrollbars. Both, and the
         theme decides. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS reads its own trio, not the standard above: without these an
         added-to-home-screen Ashwake opens inside Safari chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ashwake" />
    <meta
      name="description"
      content="An expedition into a dark plane. Place, ripen, pop, and push on."
    />
    <!-- Every path 200s with this page (SPA fallback), so every shared
         ?seed=/?daily= link is a crawlable duplicate — the canonical keeps
         search engines pointed at the one front door. -->
    <link rel="canonical" href="https://tiles.marcportal.com/" />
    <meta property="og:title" content="Ashwake" />
    <meta
      property="og:description"
      content="An expedition into a dark plane. Place, ripen, pop, and push on."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tiles.marcportal.com/" />
    <meta property="og:site_name" content="Ashwake" />
    <meta
      property="og:image:alt"
      content="A torchlit pocket of hex tiles on an endless dark plane, remembered ground fading toward three glowing beacons."
    />
    <!-- A real baked share card (scripts/social.ts), not the install icon
         stretched wide — 1200x630 is the aspect every unfurl (Discord,
         Slack, Twitter) crops to, so this one does not get cropped. -->
    <meta property="og:image" content="https://tiles.marcportal.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://tiles.marcportal.com/og-image.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- PNG, not SVG: iOS ignores SVG here and falls back to a screenshot. -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <!-- The long form for crawlers and history lists; main.ts trims the tab
         back to the bare name the moment it boots. -->
    <title>Ashwake — an expedition into a dark plane</title>
    <!-- The browser floor guard (2026-08-20, launch audit): the bundle
         needs Safari/iOS 16.4-era syntax, and on anything older the entry
         MODULE fails to parse — including the error listener inside it —
         leaving a front door whose BEGIN does nothing, forever, silently.
         A CLASSIC script parses everywhere back to ES5; if the probe
         throws, the visitor gets one honest sentence instead. -->
    <script>
      try {
        // Private class methods + static blocks: the newest syntax the
        // shipped bundle actually uses. Parse failure lands in catch.
        new Function('class P { #m() { return 1 ?? 2; } static { } }');
      } catch (e) {
        document.addEventListener('DOMContentLoaded', function () {
          document.body.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
            'background:#0a0806;color:#e8d6ae;font-family:Georgia,serif;padding:24px;text-align:center;">' +
            '<p style="max-width:26em;line-height:1.6">ASHWAKE needs a newer browser — ' +
            'iOS 16.4 or later, or an up-to-date Chrome or Firefox. ' +
            'Nothing is wrong with your device; this game just leans on the newest engine features.</p></div>';
        });
      }
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <!-- The front door: shown before the first interaction, over
           everything else in #app. BEGIN starts (or RESUMES) the run that is
           already booting quietly underneath it — the game never waits on
           this screen, so dismissing it costs nothing. MORE ▸ HOW TO PLAY
           opens the same manual the in-game ? does, via Game#openHelp. -->
      <!-- Named for screen readers (2026-08-20): a role="dialog" with no
           accessible name is an automatic Lighthouse failure, and this one
           is the first thing anybody meets. -->
      <div
        id="front-door"
        role="dialog"
        aria-modal="true"
        aria-labelledby="front-door-name"
        tabindex="-1"
      >
        <!-- Name, mark and tagline are IN the markup (2026-08-20, launch
             audit): the pre-JS first paint used to be a nameless dark
             screen. main.ts overwrites all three idempotently at boot. -->
        <img id="front-door-logo" src="/icon.svg" alt="" width="56" height="56" />
        <p id="front-door-name">Ashwake</p>
        <p id="front-door-tagline">
          An expedition into a dark plane. Place, ripen, pop, and push on.
        </p>
        <noscript>
          <p>Ashwake is a game, and it needs JavaScript switched on to play.</p>
        </noscript>
        <!-- The playstyle menu (2026-08-19): main.ts names which game BEGIN
             opens — your world, the daily, or a shared run. The mode line and
             every quiet button start hidden; the shell reveals what applies.

             LEAN since 2026-08-25 (Marc: "make sure our homepage is lean —
             WORLDS, DAILY, MORE"). The door had grown to eleven buttons and
             three of them were data management; a stranger's first screen was
             a control panel with a wipe on it. It is BEGIN and three doors
             now, and everything that is not "play right now" lives behind
             MORE. Nothing was deleted — every control still exists, one tap
             further from the thumb that was never reaching for it. -->
        <p id="front-door-mode" class="flag-note" hidden></p>
        <button id="front-door-begin" type="button">BEGIN</button>
        <!-- WORLDS: the three save slots, and the camp that starts deep in
             one. A door rather than a list — the list is a panel now, because
             three world rows plus BEGIN AT CAMP was four of the door's buttons
             spent on a choice most loads do not make. Home mode only, so a
             detour's door stays about the detour. -->
        <button id="front-door-worlds" type="button" class="quiet" hidden>WORLDS</button>
        <button id="front-door-daily" type="button" class="quiet" hidden>DAILY</button>
        <!-- Continue FROM a seed (2026-08-19): shared-link mode only, and it
             stays ON the door because that door has three buttons in total and
             SETTLE is the whole reason somebody keeps a stranger's world. -->
        <button id="front-door-settle" type="button" class="quiet" hidden>SETTLE</button>
        <button id="front-door-home" type="button" class="quiet" hidden>YOUR WORLD</button>
        <!-- MORE: HOW TO PLAY, the hall of fame, settings, the way off this
             device, and the wipe. Always offered, because HOW TO PLAY is
             behind it and that is the only tutorial door a stranger ever
             sees. -->
        <button id="front-door-more" type="button" class="quiet">MORE</button>
      </div>

      <!-- WORLDS (2026-08-25). The three save slots, one row each, plus the
           camp that wakes a fresh run at this world's farthest territory —
           every way INTO a world, in one place. Filled by main.ts from the
           same storage the door reads. Outside #game-shell for the same inert
           reason every other panel is: it opens from the front door, before
           the shell is ever live. -->
      <div
        id="worlds-panel"
        class="panel-sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="worlds-title"
        tabindex="-1"
        hidden
      >
        <div class="panel-head">
          <p id="worlds-title" class="panel-title">WORLDS</p>
          <button id="worlds-back" type="button" class="panel-back">BACK</button>
        </div>
        <!-- What a world IS, said once, where the choice is actually made. It
             was nowhere on the old door: three unexplained slot buttons and a
             mode line that assumed you already knew. -->
        <p id="worlds-note" class="flag-note">
          Three worlds live on this device. Relics and the perks you find travel between them; the
          map, the territories and everything you buy stay with the world you bought them in.
        </p>
        <div id="worlds-list" class="panel-menu"></div>
        <!-- Camps (2026-08-19): once the camp shrine is woken, a fresh run may
             begin at the world's farthest territory. -->
        <div class="panel-menu">
          <button id="worlds-camp" type="button" class="quiet" hidden>BEGIN AT CAMP</button>
        </div>
      </div>

      <!-- MORE (2026-08-25): the door's second half, folded away. HOW TO PLAY
           and SETTINGS open panels of their own on top of this one; the hall
           of fame is its own screen below; and the three data controls sit at
           the bottom under their own heading, where somebody thinking about
           their data will look and nobody else has to. -->
      <div
        id="more-panel"
        class="panel-sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="more-title"
        tabindex="-1"
        hidden
      >
        <div class="panel-head">
          <p id="more-title" class="panel-title">MORE</p>
          <button id="more-back" type="button" class="panel-back">BACK</button>
        </div>
        <div class="panel-menu">
          <button id="more-help" type="button" class="quiet">HOW TO PLAY</button>
          <!-- The hall of fame (Marc, 2026-08-20): what this device has done,
               across all three worlds. The timeline it was promised arrived
               the same day (LOG.md Session 31; always on since launch week):
               TIMELINE · DAILY · TOTALS tabs, filled by main.ts. Home mode
               only, and absent entirely on a device with nothing in it. -->
          <button id="more-fame" type="button" class="quiet" hidden>HALL OF FAME</button>
          <button id="more-settings" type="button" class="quiet">SETTINGS</button>
        </div>
        <!-- The way OUT of this device (2026-08-21). The game has no backend
             and no account, so localStorage is the only copy of everything a
             player has — and Safari evicts a non-persisted origin after about
             a week away, in-app browsers discard it wholesale, and phones get
             replaced. Every other guard makes loss less likely; this is the
             one that makes it survivable. Beside RESET ALL because this is
             where somebody looks when they are thinking about their data —
             which is now a place they have to go to, rather than the first
             screen of the game. -->
        <p id="more-data-title" class="panel-title" hidden>THIS DEVICE</p>
        <div class="panel-menu">
          <button id="more-backup" type="button" class="quiet" hidden>BACK UP MY WORLDS</button>
          <button id="more-restore" type="button" class="quiet" hidden>RESTORE A BACKUP</button>
          <!-- The one true wipe: run, world, shop, records, settings — the
               stranger-handing-back-the-phone control. Two taps, like NEW
               WORLD. `hidden` in the MARKUP (2026-08-20): main() decides
               whether this device has anything worth wiping and unhides it. -->
          <button id="more-reset" type="button" hidden>RESET ALL</button>
        </div>
      </div>

      <!-- SETTINGS, its own screen since 2026-08-25. It was the bottom half of
           the `?` panel, under the whole manual, which is why the front door
           could not offer it without dumping a stranger into a scroll past
           four tabs of prose. `mountSettings` (main.ts) writes the body from
           the feature registry, whose notes carry the decisions — one source,
           so the screen cannot go stale against them. Opened from MORE on the
           door, and from the MENU tab mid-run. -->
      <div
        id="settings-panel"
        class="panel-sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settings-title"
        tabindex="-1"
        hidden
      >
        <div class="panel-head">
          <p id="settings-title" class="panel-title">SETTINGS</p>
          <button id="settings-back" type="button" class="panel-back">BACK</button>
        </div>
        <div id="settings-body"></div>
      </div>

      <!-- The hall of fame's own screen, OUTSIDE #game-shell for the same
           inert reason the manual is: it opens from MORE on the front door,
           before the shell is ever live. Filled by main.ts from the same
           storage the worlds panel's own rows read. -->
      <div
        id="fame-panel"
        class="panel-sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="fame-title"
        tabindex="-1"
        hidden
      >
        <div class="panel-head">
          <p id="fame-title" class="panel-title">HALL OF FAME</p>
          <button id="fame-back" type="button" class="panel-back">BACK</button>
        </div>
        <div id="fame-body"></div>
      </div>

      <!-- The manual, OUTSIDE #game-shell on purpose: an `inert` ancestor
           makes every descendant unfocusable and untappable regardless of
           z-index, and this panel has to open (from MORE on the front door)
           before #game-shell ever loses that attribute. Written by the game
           from its LIVE tuning, so it cannot go stale. Tapping prose closes
           the panel.

           The switchboard that used to sit under it is its own screen now
           (#settings-panel, 2026-08-25): a manual and a switchboard are two
           different questions, and stacking them is exactly why SETTINGS
           could only be reached by scrolling past four tabs of prose. -->
      <div id="help-panel" class="panel-sheet" hidden>
        <div id="help-manual"></div>
      </div>

      <!-- The MENU tab's contents (Marc, 2026-08-20: "add a menu in ? or
           similar to go back to main menu, new run, new world, etc. with the
           'your world' stats"). Declared out here and relocated into the
           manual's first tab by `#buildManual`, the same trick #themes uses
           below: the atlas and the ledger are read from storage, which is
           main.ts's business, while the tab that frames them is the Game's.
           The ways OUT of a run used to be the last thing on a long settings
           scroll, and the world's own numbers sat beside the switches; both
           are now the first thing the ? panel opens onto. -->
      <div id="help-menu"></div>

      <!-- Art directions, one button each. Declared here rather than inside
           #game-shell — `mountSettings` (main.ts) relocates this exact node
           into #settings-body, under the DEVELOPER fold’s ui.themePicker row,
           the moment SETTINGS first paints (2026-08-18: "the theme picker
           moves out of the page flow into SETTINGS"). Its own content is
           still only ever populated while ?ff=ui.themePicker is on; Gate E
           opened on 2026-08-15 and torchlit is the direction, but the
           others stay loaded because a default is a decision, not a cage. -->
      <nav id="themes" hidden></nav>

      <!-- Everything the front door covers, and inert while it does — a
           keyboard user must not be able to tab into a board they cannot
           see yet. -->
      <div id="game-shell" inert>
        <!-- The run's whole state in one line: what you have, what you have
             scored, how deep you are, and what the next tile costs. The cost is
             here because it is the thing that eventually kills you. -->
        <header id="stats"></header>

        <!-- `tabindex="-1"` so focus can be GIVEN to the board without
             putting it in the tab order (2026-08-20): closing an event card
             hands focus back here rather than dropping it to <body>. The
             board is a WebGL canvas with no accessible content of its own —
             a real keyboard path for placing tiles is a post-1.0 job, noted
             in POLISH.md; this is only the floor that stops focus vanishing. -->
        <div id="board" tabindex="-1">
          <!-- The camera, floating over the canvas, bottom-right — a thumb's
               natural reach holding the phone one-handed. One discrete
               control (Stage 2, 2026-08-18): pinch and drag already do
               continuous zoom and pan, so FIT/+/− became one FIT ⇄ HERE
               toggle. Its label and aria-label are written by the game
               (Game#syncCamera) because they name where a tap GOES, not a
               fixed word. -->
          <div id="camera">
            <button id="help" type="button" aria-label="How to play">?</button>
            <!-- Sound, mid-run (Marc's launch call, 2026-08-20): mute
                 exactly where sound happens. Ships muted — the silent-1.0
                 ruling stands as the default; this is the easy way in.
                 main.ts owns its state, label and the flag it persists. -->
            <button
              id="sound-toggle"
              type="button"
              class="muted"
              aria-pressed="false"
              aria-label="Sound off — tap for sound"
            >
              ♪
            </button>
            <button id="camera-toggle" type="button">FIT</button>
          </div>
          <!-- What just happened, or what the glyph you tapped does. Over the
             board, glyph first, gone on a tap. aria-live so a screen reader
             hears the announcement without focus ever moving. -->
          <div id="toast" aria-live="polite" hidden></div>
        </div>

        <!-- The event card (Stage 2, 2026-08-18): held, centred, dismissed
             on purpose — for a find, a shrine or a territory, the things
             worth stopping for. Everything else (a cache, a site, the
             arithmetic of a pop) stays the one-line toast above, which
             times out on its own. A real dialog, like the manual: role,
             modality, focus in on open, Escape and a tap both dismiss. -->
        <div id="event-card" hidden>
          <div
            id="event-card-panel"
            role="dialog"
            aria-modal="true"
            aria-label="What just happened"
            tabindex="-1"
          >
            <p id="event-card-glyph"></p>
            <p id="event-card-text"></p>
            <button id="event-card-dismiss" type="button">GOT IT</button>
          </div>
        </div>

        <!-- The reorientation line: what to do now, ONE clause (Stage 2,
             2026-08-18) — or a long-pressed draft card's calculation. The
             destination signpost moved to the toast (announced on change);
             the rare-tile odds moved onto the purse toggle, below. aria-live
             for the same reason as the toast. -->
        <p id="hint" aria-live="polite" hidden></p>

        <!-- Both payouts sit on screen with their real numbers at all times. The
           harvest is only a decision if you can see what you are giving up. -->
        <div id="controls">
          <div id="draft"></div>

          <!-- The stash, on its own row under the hand (Marc, 2026-08-21).
               It rode at the end of the draft row while there was one slot;
               with two, a second card crowded a phone row that already
               carries three or four. Its own row, centre-justified like the
               hand above it, so whatever the counts are the cards stay under
               the thumb rather than drifting to an edge. -->
          <div id="stash"></div>

          <!-- POP is the decision; everything else is a variation on it. So POP
             gets the row, and the variations get a quieter one underneath —
             five equal buttons wrapping their own labels was the crammed thing
             Marc was looking at. -->
          <div id="actions">
            <button id="harvest-tiles" type="button"></button>
            <button id="harvest-points" type="button" hidden></button>
          </div>
          <div id="actions-more">
            <button id="harvest-treasure" type="button" hidden></button>
            <button id="harvest-burn" type="button" hidden></button>
          </div>

          <!-- The luck purse, folded. Open it and it is a shop; closed it is one
             line that says what you are carrying — and lights up when there is
             something you can actually afford. The spends sit BEFORE the
             toggle on purpose (Marc, 2026-08-26: "make sure it stays at the
             same place — opens up"): the toggle is the bottom-most control,
             so the shop has to unfold ABOVE it, and with the grid first in
             the column the toggle never moves when it opens. -->
          <div id="purse" hidden>
            <div id="spends" hidden></div>
            <button id="purse-toggle" type="button" aria-expanded="false"></button>
          </div>
        </div>

        <!-- Gate D's screen: cause of death, the run's arc in numbers, the
           standing best, and one button — again. Built by the game. -->
        <div id="end" hidden></div>

        <!-- Testing happens on the deployed site, so which build you are looking
           at has to be visible on the device itself. -->
        <footer id="stamp"></footer>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
