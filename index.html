<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Portrait phone is the design target. `viewport-fit=cover` plus the
      env(safe-area-inset-*) padding in style.css keeps the board clear of the
      notch and the home indicator; user-scalable=no stops a double-tap on a hex
      from zooming the page instead of placing a tile.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#14161c" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>tiles</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <!-- The run's whole state in one line: what you have, what you have
           scored, how deep you are, and what the next tile costs. The cost is
           here because it is the thing that eventually kills you. -->
      <header id="stats"></header>

      <div id="board">
        <!-- The camera and the manual, floating over the canvas. Zoom is
             buttons-first (pinch also works): unambiguous on a phone, and no
             gesture ever fights tap-to-place. -->
        <div id="camera">
          <button id="help" type="button" aria-label="How to play">?</button>
          <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
          <button id="zoom-fit" type="button" aria-label="Show everything">FIT</button>
        </div>
        <!-- The manual and the switchboard. The manual half is written by the
             game from its LIVE tuning; the settings half is written from the
             feature registry, whose notes carry the decisions — one source
             for each, so neither can go stale. Tapping prose closes the
             panel; the settings rows swallow their taps. -->
        <div id="help-panel" hidden>
          <div id="help-manual"></div>
          <div id="help-meta"></div>
        </div>
      </div>

      <!-- The colour lens: one chip per colour with its standing worth — the
           number a points harvest sums. Tap to spotlight that colour on the
           board and see the calculation in the hint line. -->
      <div id="colours"></div>

      <!-- The reorientation line: what to do now, the nearest unclaimed
           destination, the current odds — or the held-down chip's numbers. -->
      <p id="hint" hidden></p>

      <!-- Both payouts sit on screen with their real numbers at all times. The
           harvest is only a decision if you can see what you are giving up. -->
      <div id="controls">
        <div id="draft"></div>
        <div id="actions">
          <button id="harvest-tiles" type="button"></button>
          <button id="harvest-points" type="button"></button>
          <button id="leave" type="button"></button>
        </div>
      </div>

      <p id="end" hidden></p>

      <!-- Art directions, one button each. Hidden unless ?ff=ui.themePicker —
           Gate E is shut and the placeholder is the shipped look, but deciding
           between directions has to happen on the device, in daylight. -->
      <nav id="themes" hidden></nav>

      <!-- Testing happens on the deployed site, so which build you are looking
           at has to be visible on the device itself. -->
      <footer id="stamp"></footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
